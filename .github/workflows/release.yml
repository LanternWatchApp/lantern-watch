name: Build and Release .ipk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep '^VERSION' config.py | sed "s/.*= *['\"]//;s/['\"].*//")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "PKG=lanternwatch_${VERSION}_all.ipk" >> $GITHUB_OUTPUT

      - name: Build .ipk
        run: bash build_ipk.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.PKG }}
          path: ${{ steps.ver.outputs.PKG }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Lantern Watch ${{ steps.ver.outputs.VERSION }}
          body: |
            ## Install

            **GL.iNet admin panel (easiest, no SSH):**
            1. Applications → Plug-ins → **Manage Sources**
            2. Add source — Name: `lanternwatch` · URL: `https://lanternwatch.org/repo` → Apply
            3. **Refresh**, search `lanternwatch`, click **Install**
            4. Open `http://192.168.8.1:8081` and set your password

            AdGuard Home is enabled and configured automatically — no toggles to set.

            **SSH / LuCI Software (direct .ipk):**
            ```bash
            opkg install lanternwatch_${{ steps.ver.outputs.VERSION }}_all.ipk
            ```

            ## Requirements
            - GL.iNet router running OpenWrt (GL-MT6000, GL-MT3600BE, GL-MT5000, GL-MT3000, GL-MT2500)
            - Internet connection during install (downloads Python + filter lists)
          files: ${{ steps.ver.outputs.PKG }}
          prerelease: ${{ contains(steps.ver.outputs.VERSION, 'beta') || contains(steps.ver.outputs.VERSION, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The GitHub Release above is a separate distribution point from the
      # opkg feed at lanternwatch.org/repo/ — that's what the in-app "Update
      # Now" button and GL.iNet's Manage Sources actually pull from. Without
      # this step, routers see "update available" (it reads GitHub tags) but
      # "Update Now" silently reinstalls the OLD version forever, since the
      # feed never changed. Requires the SITE_DEPLOY_KEY secret — see
      # scripts/publish_feed.sh for setup.
      - name: Load site deploy key
        if: startsWith(github.ref, 'refs/tags/')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SITE_DEPLOY_KEY }}

      # publish_feed.sh signs Packages with this key (see its own comment for
      # the on-disk layout). Added 2026-10-13 (075740d) without ever wiring a
      # secret for CI to read it from — v0.19.2 was the first tag pushed since,
      # and the publish step failed outright with no file to sign with. Write
      # the same key the maintainer already has locally into the path the
      # script expects, same pattern as the deploy key above.
      - name: Load opkg feed signing key
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          umask 177
          mkdir -p "$HOME/.ssh"
          printf '%s' "${{ secrets.LW_USIGN_KEY }}" > "$HOME/.ssh/lw_usign.sec"

      # publish_feed.sh's signing step imports the `cryptography` package —
      # actions/setup-python only provisions a bare interpreter, nothing from
      # PyPI. Another part of this same never-before-exercised path that
      # nothing ever provisioned (v0.19.3's "Load opkg feed signing key" fix
      # got this run past the missing-file failure, straight into this one).
      - name: Install signing dependency
        if: startsWith(github.ref, 'refs/tags/')
        run: pip install cryptography

      - name: Publish to hosted opkg feed
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/publish_feed.sh "${{ steps.ver.outputs.PKG }}" "${{ steps.ver.outputs.VERSION }}"
