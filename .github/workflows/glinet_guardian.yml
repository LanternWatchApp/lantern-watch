name: GL.iNet Guardian Watchdog

on:
  schedule:
    # 03:00 and 15:00 UTC = 7pm and 7am PST. GitHub cron is UTC-only with no
    # DST handling, so during PDT (summer) these land at 8pm / 8am Pacific.
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a harmless test ntfy notification and exit (skips firmware detection, the test suite, Gemini, and auto-merge) — use this only to confirm the NTFY_TOPIC secret reaches your phone. Leave unchecked for a normal run (which does the GL.iNet firmware check)."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watchdog:
    name: Compatibility Watchdog & Self-Healing
    # Pinned to ubuntu-24.04 so CI can keep testing on Python 3.9 (matching
    # OpenWrt 21.02-SNAPSHOT on live GL.iNet routers). ubuntu-latest moved to
    # Ubuntu 26.04, which no longer publishes Python 3.9 in actions/python-versions.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Compatibility Test Suite
        id: test_run
        run: |
          python -m unittest tests/test_compatibility.py

      - name: Execute Guardian Watchdog
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # No hardcoded fallback name — see notify_guardian's docstring in
          # guardian_agent.py. If the secret is unset, the script skips
          # sending rather than falling back to a public, guessable topic.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GUARDIAN_TEST_NOTIFY: ${{ inputs.test_notify }}
        run: |
          python scripts/guardian_agent.py
